<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>if(!/\/$|\.html$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예약하기 | TAP SHOP BAR 탭샵바</title>
<meta name="description" content="몇 분이세요? 인원·지점·날짜만 고르면 바로 예약으로 이어져요. 큰 모임은 단체 예약·대관 문의로 연결돼요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TAP SHOP BAR">
<meta property="og:title" content="탭샵바 예약하기 · 몇 분이세요?">
<meta property="og:description" content="인원·지점·날짜만 고르면 바로 예약. 13명 이상은 단체 예약, 30명 이상은 대관 문의로.">
<meta property="og:url" content="https://tsb.wine/reservation/">
<meta property="og:image" content="https://tapshopbar.github.io/reservation/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F2A20">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--pine:#0F2A20;--pine2:#1B4433;--wine:#4A0B18;--cream:#FFFDFC;--ink:#0E0E0E;--sub:#6b6b6b;--line:#E5E1DE;--soft:#F2F0EA;--yellow:#FFC100}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--soft);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
.top{background:radial-gradient(120% 140% at 85% 0%,var(--pine2) 0%,var(--pine) 60%);color:var(--cream);padding:18px 20px 34px}
.top .bar{display:flex;justify-content:space-between;align-items:center;max-width:560px;margin:0 auto}
.top img{height:15px;filter:invert(1)}
.top a.party{color:var(--cream);font-size:13px;text-decoration:none;opacity:.85;border:1px solid rgba(255,253,252,.4);border-radius:999px;padding:5px 11px}
.top h1{max-width:560px;margin:26px auto 4px;font-size:30px;letter-spacing:-.03em;line-height:1.2}
.top p{max-width:560px;margin:0 auto;opacity:.8;font-size:14.5px}
main{max-width:560px;margin:-18px auto 0;padding:0 14px 120px}
.step{background:#fff;border-radius:22px;padding:20px 18px 22px;margin:0 0 12px;box-shadow:0 1px 0 var(--line);transition:opacity .25s}
.step.lock{opacity:.35;pointer-events:none}
.step h2{font-size:18px;margin:0 0 14px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.step h2 .n{width:24px;height:24px;border-radius:50%;background:var(--pine);color:var(--cream);font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.step h2 .val{margin-left:auto;font-size:14px;color:var(--pine);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.opt{font:inherit;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 6px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;text-align:center;line-height:1.25;min-height:56px}
.opt small{display:block;font-size:11.5px;font-weight:500;color:var(--sub);margin-top:3px}
.opt.on{background:var(--pine);border-color:var(--pine);color:var(--cream)}
.opt.on small{color:rgba(255,253,252,.75)}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt.wide{grid-column:span 2}
.opt.full{grid-column:span 4;background:#F6E9EC;border-color:#EBD3D9;color:var(--wine)}
.opt.full.on{background:var(--wine);border-color:var(--wine);color:var(--cream)}
.br{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.br .opt{display:flex;gap:10px;align-items:center;text-align:left;padding:8px;min-height:64px}
.br .opt img{width:52px;height:48px;object-fit:cover;border-radius:10px;flex:none}
.br .opt.any{justify-content:center;text-align:center}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days .opt{flex:0 0 66px;padding:10px 4px}
.days .opt.sat small{color:#1D4ED8}.days .opt.sun small{color:#B3261E}
.days .opt.on small{color:rgba(255,253,252,.8)}
.other{display:flex;gap:8px;align-items:center;margin-top:8px}
.other input{flex:1;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.lbl{font-size:13px;color:var(--sub);margin:16px 0 8px;font-weight:600}
.result{display:none;background:var(--pine);color:var(--cream);border-radius:22px;padding:22px 18px;margin:0 0 12px}
.result.show{display:block;animation:up .35s ease-out}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.result .k{font-size:12px;letter-spacing:.14em;opacity:.7;font-weight:700}
.result h3{font-size:22px;margin:6px 0 4px;letter-spacing:-.02em}
.result .sum{opacity:.85;font-size:14.5px;margin-bottom:16px}
.cta{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;font:inherit;font-size:17px;font-weight:800;border:0;border-radius:16px;padding:17px;margin:8px 0 0;text-decoration:none;cursor:pointer}
.cta.main{background:var(--cream);color:var(--pine)}
.cta.naver{background:#03C75A;color:#fff}
.cta.ghost{background:rgba(255,253,252,.12);color:var(--cream);font-size:15px;font-weight:700}
.note{font-size:13px;opacity:.8;margin-top:12px;line-height:1.6}
.note b{opacity:1}
.foot{text-align:center;font-size:12.5px;color:var(--sub);margin-top:22px}
.foot .s{color:var(--wine);font-weight:600}
.other .olbl{display:block;font-size:13px;color:var(--sub);margin:0 0 6px 2px}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><a href="https://tsb.wine/"><img src="assets/tsb_wordmark_h.png" alt="TAP SHOP BAR"></a><a class="party" href="/party/">대관 문의 →</a></div>
  <h1>몇 분이세요?</h1>
  <p>인원 · 지점 · 날짜만 고르면 바로 예약으로 이어져요.</p>
</header>

<main>
  <section class="step" id="s1">
    <h2><span class="n">1</span>인원<span class="val" id="v1"></span></h2>
    <div class="grid" id="ppl">
      <button class="opt" data-g="2">1~2<small>명</small></button>
      <button class="opt" data-g="4">3~4<small>명</small></button>
      <button class="opt" data-g="6">5~6<small>명</small></button>
      <button class="opt" data-g="8">7~8<small>명</small></button>
      <button class="opt wide" data-g="12">9~12<small>명</small></button>
      <button class="opt wide" data-g="20">13~30<small>명 · 단체</small></button>
      <button class="opt full" data-g="40" data-full="1">30명 이상 · 매장 전체 대관<small>웨딩 애프터파티 · 송년회 · 브랜드 행사</small></button>
    </div>
  </section>

  <section class="step lock" id="s2">
    <h2><span class="n">2</span>지점<span class="val" id="v2"></span></h2>
    <div class="br" id="brs">
      <button class="opt" data-b="청계"><img src="assets/loc_cheonggye.jpg" alt=""><span>청계<small>삼일빌딩</small></span></button>
      <button class="opt" data-b="상암"><img src="assets/loc_sangam.jpg" alt=""><span>상암<small>MBC몰</small></span></button>
      <button class="opt" data-b="마곡"><img src="assets/loc_magok.jpg" alt=""><span>마곡<small>VL르웨스트</small></span></button>
      <button class="opt" data-b="동대문"><img src="assets/loc_dongdaemun.jpg" alt=""><span>동대문<small>두타몰</small></span></button>
      <button class="opt" data-b="서여의도"><img src="assets/loc_hall.jpg" alt=""><span>서여의도<small>오픈 준비 중</small></span></button>
      <button class="opt any" data-b="any">추천해 주세요<small>단체 · 대관만</small></button>
    </div>
  </section>

  <section class="step lock" id="s3">
    <h2><span class="n">3</span>날짜 · 시간<span class="val" id="v3"></span></h2>
    <div class="days" id="days"></div>
    <div class="other"><label for="dOther" class="olbl">2주 뒤 날짜는 여기서 고르기</label><input type="date" id="dOther" aria-label="다른 날짜" lang="ko"></div>
    <div class="lbl">시간</div>
    <div class="grid" id="tms">
      <button class="opt" data-t="lunch">점심<small>11~14시</small></button>
      <button class="opt" data-t="afternoon">오후<small>14~17시</small></button>
      <button class="opt" data-t="dinner">저녁<small>18~21시</small></button>
      <button class="opt" data-t="late">늦게<small>21시~</small></button>
    </div>
  </section>

  <section class="result" id="res"></section>

  <div class="foot">주식회사 탭샵바 · <a href="https://tsb.wine/" style="color:inherit">tsb.wine</a><br><span class="s">wine is second americano</span></div>
</main>

<script>
// ---------- 지점별 예약 채널 (여기만 고치면 돼요) ----------
const BR = {
  '청계':   { naver:'https://m.booking.naver.com/booking/6/bizes/1180715/items/6096170', naverMax:6, catch:'', tel:'0507-1331-4095' },
  '상암':   { naver:'https://m.booking.naver.com/booking/6/bizes/1624487/items/7547407', naverMax:6, catch:'https://app.catchtable.co.kr/ct/shop/tapshopbar', catchMax:8, tel:'0507-1312-0267' },
  '마곡':   { naver:'https://m.booking.naver.com/booking/6/bizes/1713764/items/7996202', naverMax:8, catch:'', tel:'0507-1425-8809' },
  '동대문': { naver:'https://m.booking.naver.com/booking/6/bizes/1125285/items/6052917', naverMax:8, catch:'', tel:'0507-1385-7973' },
  '서여의도': { naver:'', naverMax:0, catch:'', tel:'', soon:true },
};
const GROUP_MIN = 13, FULL_MIN = 30;   // 13명부터 단체, 30명부터 전체 대관
const LOG = 'https://script.google.com/macros/s/AKfycbymH-sSHwMhwbDAPR03wYfIvW25j-ZTxm2i66geBy09zZDuiUPz2fqN6rx_JMKzL1l1lA/exec';
const PARTY = '/party/';

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const S = { g:0, full:false, b:'', d:'', t:'' };
const TL = { lunch:'점심', afternoon:'오후', dinner:'저녁', late:'늦은 저녁' };
const WK = '일월화수목금토';
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nice = k => { const d = new Date(k+'T12:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${WK[d.getDay()]})`; };
const pplLabel = () => S.full ? '30명 이상 · 전체 대관' : ($('#ppl .opt.on') ? $('#ppl .opt.on').firstChild.textContent + '명' : '');

function sel(groupSel, btn){ $$(groupSel+' .opt').forEach(x => x.classList.toggle('on', x === btn)); }
function unlock(id){ $(id).classList.remove('lock'); }
function go(id){ setTimeout(() => $(id).scrollIntoView({behavior:'smooth', block:'start'}), 120); }
const isBig = () => S.full || S.g >= GROUP_MIN;

// 1. 인원
$('#ppl').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(!b) return;
  sel('#ppl', b); S.g = +b.dataset.g; S.full = !!b.dataset.full; $('#v1').textContent = pplLabel();
  // 지점: 소규모는 서여의도·추천 비활성
  $$('#brs .opt').forEach(x => { const k = x.dataset.b; x.disabled = !isBig() && (k === 'any' || (BR[k] && BR[k].soon)); if (x.disabled && x.classList.contains('on')) { x.classList.remove('on'); S.b=''; $('#v2').textContent=''; } });
  unlock('#s2'); render(); go('#s2');
});
// 2. 지점
$('#brs').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(!b || b.disabled) return;
  sel('#brs', b); S.b = b.dataset.b; $('#v2').textContent = S.b === 'any' ? '추천' : S.b;
  unlock('#s3'); render(); go('#s3');
});
// 3. 날짜
(function(){
  const t = new Date(); let h = '';
  for (let i=0;i<14;i++){ const d = new Date(t); d.setDate(t.getDate()+i); const k = ymd(d);
    const lab = i===0 ? '오늘' : i===1 ? '내일' : `${d.getMonth()+1}/${d.getDate()}`;
    h += `<button class="opt${d.getDay()===6?' sat':d.getDay()===0?' sun':''}" data-d="${k}">${lab}<small>${WK[d.getDay()]}요일</small></button>`; }
  $('#days').innerHTML = h; $('#dOther').min = ymd(t);
})();
$('#days').addEventListener('click', e => { const b = e.target.closest('.opt'); if(!b) return; sel('#days', b); $('#dOther').value=''; S.d = b.dataset.d; afterDate(); });
$('#dOther').addEventListener('change', e => { if(!e.target.value) return; sel('#days', null); S.d = e.target.value; afterDate(); });
$('#tms').addEventListener('click', e => { const b = e.target.closest('.opt'); if(!b) return; sel('#tms', b); S.t = b.dataset.t; afterDate(true); });
function afterDate(timePicked){
  $('#v3').textContent = [S.d ? nice(S.d) : '', S.t ? TL[S.t] : ''].filter(Boolean).join(' ');
  render(); if (S.d && (S.t || timePicked)) go('#res');
}

// 결과
function partyUrl(type){
  const q = new URLSearchParams({ type, g:String(S.g), s:'reservation' });
  if (S.b) q.set('b', S.b); if (S.d) q.set('d', S.d); if (S.t) q.set('t', S.t);
  return PARTY + '?' + q.toString() + '#inquiry';
}
function log(kind){ try { const q = new URLSearchParams({a:'log', k:kind, g:S.g, b:S.b, d:S.d, t:S.t, r:document.referrer.slice(0,80)}); new Image().src = LOG + '?' + q; } catch(e){} }
function render(){
  const r = $('#res');
  if (!S.g || !S.b || !S.d) { r.classList.remove('show'); return; }
  const sum = `${pplLabel()} · ${S.b==='any'?'지점 추천':S.b} · ${nice(S.d)}${S.t?' '+TL[S.t]:''}`;
  const info = BR[S.b] || {};
  let h = '';
  if (S.full || S.g >= FULL_MIN) {
    h = `<div class="k">PRIVATE PARTY</div><h3>전체 대관으로 안내할게요</h3><div class="sum">${sum}</div>
      <a class="cta main" href="${partyUrl('full')}" data-log="full">대관 문의 이어서 하기 →</a>
      <div class="note">고른 내용은 그대로 넘어가요. 이름·연락처와 원하는 구성만 남기시면 <b>24시간 안에 견적</b>을 보내드려요. 대관은 승인 후 예약금 20% 입금 시 확정돼요.</div>`;
  } else if (S.g >= GROUP_MIN || !info.naver || S.g > Math.max(info.naverMax||0, info.catchMax||0)) {
    h = `<div class="k">GROUP</div><h3>단체 예약으로 안내할게요</h3><div class="sum">${sum}</div>
      <a class="cta main" href="${partyUrl('group')}" data-log="group">단체 예약 문의 이어서 하기 →</a>
      <div class="note">${S.g < GROUP_MIN ? '이 인원은 온라인 예약 좌석보다 많아서 점장이 직접 자리를 잡아 드려요. ' : ''}이름·전화번호만 남기시면 <b>점장이 24시간 안에 연락</b>드려 메뉴와 좌석을 안내해요.</div>`;
  } else {
    const useCatch = info.catch && S.g > (info.naverMax||0);
    h = `<div class="k">RESERVATION</div><h3>바로 예약할 수 있어요</h3><div class="sum">${sum}</div>
      ${!useCatch ? `<a class="cta naver" href="${info.naver}${info.naver.includes('?')?'&':'?'}startDate=${S.d}" target="_blank" rel="noopener" data-log="naver">네이버 예약으로 이어가기 →</a>` : ''}
      ${info.catch ? `<a class="cta ${useCatch?'main':'ghost'}" href="${info.catch}" target="_blank" rel="noopener" data-log="catch">캐치테이블로 예약하기 →</a>` : ''}
      <div class="note">예약 화면에서 <b>${nice(S.d)}${S.t?' '+TL[S.t]:''}</b>을 한 번 더 골라 주세요.${info.tel ? ` 원하는 시간이 없으면 매장으로 전화 주세요 · <a href="tel:${info.tel}" style="color:inherit">${info.tel}</a>` : ''}</div>`;
  }
  r.innerHTML = h; r.classList.add('show');
}
document.addEventListener('click', e => { const a = e.target.closest('[data-log]'); if (a) log(a.dataset.log); });
</script>
</body>
</html>
